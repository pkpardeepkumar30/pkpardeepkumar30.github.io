<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
<title id="title">Pardeep Kumar — Curiosity-driven school education</title>
<desc id="description">Curiosity is not a privilege. It is how children learn.</desc>
<rect width="1200" height="630" fill="#f6f5f0"/>
<rect x="880" width="320" height="630" fill="#243d2d"/>
<circle cx="1120" cy="150" r="240" fill="none" stroke="#c4d1b0" opacity=".2"/>
<circle cx="1120" cy="150" r="180" fill="none" stroke="#c4d1b0" opacity=".2"/>
<text x="70" y="82" fill="#486447" font-family="Arial,sans-serif" font-size="17" letter-spacing="4">CURIOSITY · INQUIRY · LEARNING HOW TO LEARN</text>
<text x="70" y="216" fill="#202c28" font-family="Georgia,serif" font-size="70">Curiosity is not</text>
<text x="70" y="301" fill="#202c28" font-family="Georgia,serif" font-size="70">a privilege.</text>
<text x="70" y="376" fill="#486447" font-family="Georgia,serif" font-size="46" font-style="italic">It is how children learn.</text>
